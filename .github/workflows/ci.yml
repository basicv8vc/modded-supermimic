name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-audit-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Audit V2 registry & record cards
        run: python3 scripts/v2/audit_registry.py

      - name: Run GPU-free benchmark & policy unit tests
        run: pytest -v tests/test_benchmark.py tests/test_benchmark_v2.py tests/test_v2_gpu_runtime.py tests/test_policy_interface.py
